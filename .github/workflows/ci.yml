name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q centor.py cli.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run batch smoke test
        run: python cli.py batch -i sample.csv -o out_smoke.csv

  web:
    name: Browser calculator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/calculator.mjs
      - name: Run browser-logic tests
        run: node --test web/tests/*.test.mjs
